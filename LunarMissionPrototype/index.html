<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>God's Eye View — Lunar Mission</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="hud-shell">
      <div class="header-left">
        <div class="brand-row">
          <div class="brand-mark">◌</div>
          <div class="brand-text">
            <span class="brand-main">GOD'S EYE VIEW</span>
            <span class="brand-sub">NO PLACE LEFT BEHIND</span>
          </div>
        </div>
      </div>

      <div class="header-right">
        <div class="status-text">ACTIVE STYLE</div>
        <div class="status-mode">LUNAR</div>
      </div>

      <aside class="left-panel">
        <div class="section-label">MISSION / SITE</div>
        <div class="bigline" id="siteName">SHACKLETON RIM</div>
        <div class="subline" id="siteCoords">89.9° S · 0.0°</div>

        <div class="mini-block">
          <div class="mini-title">DATA LAYERS</div>
          <div class="mini-value">LUNAR SURFACE / SUN / EARTH</div>
        </div>

        <div class="mini-block muted-block">
          <div class="mini-title">SCENES</div>
          <div class="mini-value">LANDING ANALYSIS</div>
        </div>
      </aside>

      <main class="scene-area">
        <div class="moon-shell">
          <svg id="moonScene" viewBox="0 0 700 700" aria-label="Lunar mission view">
            <defs>
              <radialGradient id="moonGlow" cx="35%" cy="35%">
                <stop offset="0%" stop-color="#f3f1eb" />
                <stop offset="50%" stop-color="#d2d0ca" />
                <stop offset="100%" stop-color="#8a8784" />
              </radialGradient>
            </defs>
            <g id="moonSurface">
              <circle cx="350" cy="350" r="235" class="moon-core" />
              <circle cx="350" cy="350" r="235" class="moon-sheen" />
            </g>
            <g id="trajectoryLayer"></g>
            <g id="siteLayer"></g>
            <g id="sunLayer"></g>
            <g id="earthLayer"></g>
          </svg>
        </div>
      </main>

      <aside class="right-panel">
        <div class="status-line">
          <span class="dot"></span>
          <span id="statusText">LUNAR SITE ACTIVE</span>
        </div>

        <div class="panel-block accent">
          <div class="metric-label">SUN EL</div>
          <div class="metric-value" id="sunElevation">--</div>
        </div>
        <div class="panel-block accent2">
          <div class="metric-label">EARTH EL</div>
          <div class="metric-value" id="earthElevation">--</div>
        </div>

        <div class="panel-block">
          <div class="metric-label">POWER</div>
          <div class="metric-value" id="powerPotential">--</div>
        </div>

        <div class="panel-block">
          <div class="metric-label">DTE WINDOWS</div>
          <ul id="windowList" class="window-list"></ul>
        </div>
      </aside>

      <div class="bottom-bar">
        <div class="bottom-left">
          <div class="meta-item">SITE SLOPE: <span id="slopeValue">--</span></div>
          <div class="meta-item">RISK: <span id="riskValue">--</span></div>
        </div>
        <div class="bottom-right">
          <div class="meta-item">SIM DATE: <span id="currentDateLabel">--</span></div>
        </div>
      </div>
    </div>

    <input id="timeSlider" type="range" min="0" max="100" value="50" aria-label="simulation timeline" />

    <script src="app.js"></script>
  </body>
</html>
